name: NPM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      npm_tag:
        description: 'NPM tag (latest, beta, next)'
        required: false
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - next

jobs:
  build-binaries:
    name: Build Native Binaries
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - os: macos-13
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      
      - name: Build release binary
        working-directory: codex-rs
        run: cargo build --release --target ${{ matrix.target }} --bin codex
      
      - name: Package binary
        shell: bash
        run: |
          mkdir -p npm-package/bin
          
          # Copy and rename binary
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            cp codex-rs/target/${{ matrix.target }}/release/codex.exe npm-package/bin/osmiflow-${{ matrix.platform }}-${{ matrix.arch }}.exe
          else
            cp codex-rs/target/${{ matrix.target }}/release/codex npm-package/bin/osmiflow-${{ matrix.platform }}-${{ matrix.arch }}
            chmod +x npm-package/bin/osmiflow-${{ matrix.platform }}-${{ matrix.arch }}
          fi
          
      - name: Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: npm-package/bin/*

  publish-npm:
    name: Publish to NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "npm_tag=${{ github.event.inputs.npm_tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          fi
      
      - name: Create npm package directory
        run: mkdir -p npm-publish/bin
      
      - name: Download all binaries
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Organize binaries
        run: |
          # Move all binaries to the bin directory
          for artifact_dir in artifacts/binary-*; do
            if [ -d "$artifact_dir" ]; then
              cp -r $artifact_dir/* npm-publish/bin/
            fi
          done
          
          # List binaries for verification
          ls -la npm-publish/bin/
      
      - name: Create package.json
        working-directory: npm-publish
        run: |
          cat > package.json << 'EOF'
          {
            "name": "@osmi/osmiflow",
            "version": "${{ steps.get_version.outputs.version }}",
            "description": "AI-powered coding assistant built on Codex",
            "keywords": ["ai", "coding", "assistant", "cli", "developer-tools"],
            "homepage": "https://github.com/cchuter/codex",
            "bugs": {
              "url": "https://github.com/cchuter/codex/issues"
            },
            "repository": {
              "type": "git",
              "url": "git+https://github.com/cchuter/codex.git"
            },
            "license": "Apache-2.0",
            "author": "cchuter",
            "main": "index.js",
            "bin": {
              "osmiflow": "bin/osmiflow"
            },
            "scripts": {
              "postinstall": "node postinstall.js"
            },
            "files": [
              "bin/",
              "index.js",
              "postinstall.js",
              "README.md"
            ],
            "engines": {
              "node": ">=16.0.0"
            },
            "os": [
              "darwin",
              "linux",
              "win32"
            ],
            "cpu": [
              "x64",
              "arm64"
            ],
            "publishConfig": {
              "access": "public"
            }
          }
          EOF
      
      - name: Create postinstall script
        working-directory: npm-publish
        run: |
          cat > postinstall.js << 'EOF'
          #!/usr/bin/env node
          const fs = require('fs');
          const path = require('path');
          const { platform, arch } = process;
          
          // Map Node.js arch to our binary naming
          const archMap = {
            'x64': 'x64',
            'arm64': 'arm64',
            'ia32': 'x86',
            'arm': 'arm'
          };
          
          const platformMap = {
            'darwin': 'darwin',
            'linux': 'linux',
            'win32': 'win32'
          };
          
          const mappedArch = archMap[arch] || arch;
          const mappedPlatform = platformMap[platform] || platform;
          
          const binaryName = `osmiflow-${mappedPlatform}-${mappedArch}${platform === 'win32' ? '.exe' : ''}`;
          const binaryPath = path.join(__dirname, 'bin', binaryName);
          const targetPath = path.join(__dirname, 'bin', `osmiflow${platform === 'win32' ? '.exe' : ''}`);
          
          if (!fs.existsSync(binaryPath)) {
            console.error(`
          Error: Unsupported platform/architecture combination: ${platform}/${arch}
          OsmiFlow supports:
          - macOS (x64, arm64)
          - Linux (x64)
          - Windows (x64)
          
          Please open an issue at https://github.com/cchuter/codex/issues if you need support for your platform.
          `);
            process.exit(1);
          }
          
          try {
            // Remove existing symlink/file if it exists
            if (fs.existsSync(targetPath)) {
              fs.unlinkSync(targetPath);
            }
            
            // Create symlink to the appropriate binary
            if (platform === 'win32') {
              // On Windows, copy the file instead of symlinking
              fs.copyFileSync(binaryPath, targetPath);
            } else {
              // On Unix systems, create a symlink
              fs.symlinkSync(binaryName, targetPath);
            }
            
            // Make sure it's executable (Unix only)
            if (platform !== 'win32') {
              fs.chmodSync(targetPath, 0o755);
            }
            
            console.log(`✓ OsmiFlow installed successfully for ${platform}/${arch}`);
          } catch (error) {
            console.error('Failed to set up OsmiFlow binary:', error);
            process.exit(1);
          }
          EOF
      
      - name: Create index.js
        working-directory: npm-publish
        run: |
          cat > index.js << 'EOF'
          #!/usr/bin/env node
          const { spawn } = require('child_process');
          const path = require('path');
          
          const binary = path.join(__dirname, 'bin', 'osmiflow');
          const args = process.argv.slice(2);
          
          const child = spawn(binary, args, {
            stdio: 'inherit',
            shell: false
          });
          
          child.on('exit', (code) => {
            process.exit(code);
          });
          
          child.on('error', (err) => {
            console.error('Failed to start OsmiFlow:', err);
            process.exit(1);
          });
          EOF
      
      - name: Create README
        working-directory: npm-publish
        run: |
          cat > README.md << 'EOF'
          # OsmiFlow
          
          AI-powered coding assistant built on Codex.
          
          ## Installation
          
          ```bash
          npm install -g @osmi/osmiflow
          ```
          
          ## Usage
          
          ```bash
          osmiflow --help
          ```
          
          ## Supported Platforms
          
          - macOS (Intel x64)
          - macOS (Apple Silicon arm64)
          - Linux (x64)
          - Windows (x64)
          
          ## Documentation
          
          For full documentation, visit: https://github.com/cchuter/codex
          
          ## License
          
          Apache-2.0
          EOF
      
      - name: Publish to NPM
        working-directory: npm-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --tag ${{ steps.get_version.outputs.npm_tag }}
      
      - name: Add dist-tag if not latest
        if: steps.get_version.outputs.npm_tag != 'latest'
        working-directory: npm-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Also tag as the specific version for easier access
          npm dist-tag add @osmi/osmiflow@${{ steps.get_version.outputs.version }} v${{ steps.get_version.outputs.version }}