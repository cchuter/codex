name: ci

on:
  pull_request: {}
  push: { branches: [main] }

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build Rust binaries for npm packaging
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binaries
        run: |
          cd codex-rs
          cargo build --release --bin osmiflow
          cargo build --release --bin apply_patch
          cd ..

      # stage_npm_packages.py requires DotSlash when staging releases.
      - uses: facebook/install-dotslash@v2

      - name: Stage npm package
        id: stage_npm_package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OSMIFLOW_VERSION=0.0.0-ci
          OUTPUT_DIR="${RUNNER_TEMP}"

          # Create vendor directory structure for CI builds
          VENDOR_DIR="${RUNNER_TEMP}/vendor"
          mkdir -p "$VENDOR_DIR/x86_64-unknown-linux-gnu/osmiflow"
          mkdir -p "$VENDOR_DIR/x86_64-unknown-linux-gnu/apply_patch"
          mkdir -p "$VENDOR_DIR/x86_64-unknown-linux-gnu/path"

          # Copy the built binaries to vendor directory
          cp codex-rs/target/release/osmiflow "$VENDOR_DIR/x86_64-unknown-linux-gnu/osmiflow/osmiflow-x86_64-unknown-linux-gnu"
          cp codex-rs/target/release/apply_patch "$VENDOR_DIR/x86_64-unknown-linux-gnu/apply_patch/apply_patch-x86_64-unknown-linux-gnu"

          # Create a placeholder for rg (ripgrep) since it's not built here
          touch "$VENDOR_DIR/x86_64-unknown-linux-gnu/path/rg"

          # Build the npm package directly without using stage_npm_packages.py
          # since it requires GitHub workflow artifacts
          STAGING_DIR="${RUNNER_TEMP}/npm-staging"
          mkdir -p "$STAGING_DIR"

          python3 ./codex-cli/scripts/build_npm_package.py \
            --package codex \
            --version "$OSMIFLOW_VERSION" \
            --staging-dir "$STAGING_DIR" \
            --vendor-src "$VENDOR_DIR" \
            --pack-output "$OUTPUT_DIR/osmiflow-npm-${OSMIFLOW_VERSION}.tgz"

          PACK_OUTPUT="${OUTPUT_DIR}/osmiflow-npm-${OSMIFLOW_VERSION}.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload staged npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmiflow-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Ensure codex-cli/README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py codex-cli/README.md
      - name: Check codex-cli/README ToC
        run: python3 scripts/readme_toc.py codex-cli/README.md

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format
