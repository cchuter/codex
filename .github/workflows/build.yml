name: Build Codex

on:
  push:
    branches: [ main, feat/ci, osmi-proxy-defaults ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          components: rustfmt, clippy
      
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: codex-rs/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      
      - name: Build Codex
        working-directory: codex-rs
        run: |
          cargo build --release --target aarch64-apple-darwin
      
      - name: Run tests
        working-directory: codex-rs
        run: |
          cargo test --release --target aarch64-apple-darwin
      
      - name: Run clippy
        working-directory: codex-rs
        run: |
          cargo clippy --all-targets --all-features --target aarch64-apple-darwin -- -D warnings
      
      - name: Check formatting
        working-directory: codex-rs
        run: |
          cargo fmt -- --check --config imports_granularity=Item
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: codex-macos-arm64
          path: codex-rs/target/aarch64-apple-darwin/release/codex
          retention-days: 7

  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
      
      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: codex-rs/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      
      - name: Build Codex
        working-directory: codex-rs
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
      
      - name: Run tests
        working-directory: codex-rs
        run: |
          cargo test --release --target x86_64-unknown-linux-gnu
      
      - name: Run clippy
        working-directory: codex-rs
        run: |
          cargo clippy --all-targets --all-features --target x86_64-unknown-linux-gnu -- -D warnings
      
      - name: Check formatting
        working-directory: codex-rs
        run: |
          cargo fmt -- --check --config imports_granularity=Item
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: codex-linux-amd64
          path: codex-rs/target/x86_64-unknown-linux-gnu/release/codex
          retention-days: 7

  build-summary:
    name: Build Summary
    needs: [build-macos-arm64, build-linux-amd64]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build results
        run: |
          if [[ "${{ needs.build-macos-arm64.result }}" == "success" && "${{ needs.build-linux-amd64.result }}" == "success" ]]; then
            echo "✅ All builds completed successfully"
            exit 0
          else
            echo "❌ One or more builds failed"
            echo "macOS arm64: ${{ needs.build-macos-arm64.result }}"
            echo "Linux amd64: ${{ needs.build-linux-amd64.result }}"
            exit 1
          fi